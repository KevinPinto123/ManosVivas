<!doctype html>
<html lang="es-PE">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>ManosVivas · Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo navegable de ManosVivas: Agente Negocio, Agente Marca y Mercado, sincronizados en vivo.">
<link rel="icon" type="image/svg+xml" href="img/Logo_vector.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/estilos.css">
<script>
// Antes de pintar, para que no parpadee al recargar con tema fijado.
try {
  var t = localStorage.getItem('manosvivas.tema');
  if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
  else if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark');
} catch (e) {}
</script>
</head>
<body>

<div id="app-raiz"></div>

<noscript>
  <div style="padding:32px;font-family:system-ui">
    <h1>ManosVivas</h1>
    <p>Este prototipo necesita JavaScript para funcionar. Actívalo y recarga la página.</p>
  </div>
</noscript>

<script src="js/tema.js"></script>
<script src="js/semilla.js"></script>
<script src="js/almacen.js"></script>
<script src="js/ui.js"></script>
<script src="js/agente.js"></script>
<script src="js/canal-whatsapp.js"></script>
<script src="js/canal-app.js"></script>
<script src="js/canal-mercado.js"></script>
<script src="js/main.js"></script>
</body>
</html>
